<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Infinite Long Press — Demo</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #111110;
  --surface: #1a1917;
  --surface-2: #222120;
  --surface-3: #2a2927;
  --border: rgba(255,255,255,0.08);
  --text: #e8e6e3;
  --text-muted: #888784;
  --text-faint: #4a4947;
  --accent: #4f98a3;
  --accent-dim: rgba(79,152,163,0.15);
  --accent-glow: rgba(79,152,163,0.35);
  --radius: 14px;
  --radius-sm: 8px;
  --font: 'Satoshi', -apple-system, sans-serif;
  --ease: cubic-bezier(0.16,1,0.3,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: none; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.96) translateY(12px);
  transition: opacity 0.32s var(--ease), transform 0.32s var(--ease);
  will-change: transform, opacity;
}
.screen.active {
  opacity: 1;
  pointer-events: all;
  transform: scale(1) translateY(0);
}
.screen.exit-back {
  opacity: 0;
  transform: scale(1.04) translateY(-8px);
  transition: opacity 0.22s var(--ease), transform 0.22s var(--ease);
}

.header {
  padding: 56px 20px 16px;
  flex-shrink: 0;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.app-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}
.header-badge {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-dim);
  border: 1px solid rgba(79,152,163,0.25);
  border-radius: 20px;
  padding: 3px 10px;
  letter-spacing: 0.3px;
}
.header-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 2px;
}

.depth-header {
  padding: 56px 20px 20px;
  flex-shrink: 0;
  position: relative;
}
.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 500;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 0;
  margin-bottom: 16px;
  -webkit-tap-highlight-color: transparent;
}
.back-btn svg { flex-shrink: 0; }
.depth-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-faint);
  margin-bottom: 6px;
}
.depth-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
  line-height: 1.2;
}
.depth-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 6px;
}

.depth-dots {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 16px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--surface-3);
  transition: all 0.25s var(--ease);
}
.dot.active {
  background: var(--accent);
  width: 18px;
  border-radius: 3px;
}
.dot.filled {
  background: rgba(79,152,163,0.45);
}

.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 16px 32px;
  -webkit-overflow-scrolling: touch;
}
.scroll-area::-webkit-scrollbar { display: none; }

.prompt-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.prompt-item {
  position: relative;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: background 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.15s var(--ease);
  overflow: hidden;
}
.prompt-item::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-glow);
  opacity: 0;
  border-radius: inherit;
  transition: opacity 0.15s var(--ease);
  pointer-events: none;
}
.prompt-item.pressing::after { opacity: 1; }
.prompt-item.pressing {
  transform: scale(0.975);
  border-color: rgba(79,152,163,0.35);
}

.prompt-text {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.45;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.prompt-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.prompt-time {
  font-size: 11px;
  color: var(--text-faint);
}
.prompt-depth-badge {
  font-size: 10px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-dim);
  border-radius: 10px;
  padding: 2px 7px;
  letter-spacing: 0.2px;
  margin-left: auto;
}

.press-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 48px;
  height: 48px;
  margin: -24px 0 0 -24px;
  pointer-events: none;
}
.press-ring circle {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 138;
  stroke-dashoffset: 138;
  transition: stroke-dashoffset linear;
  transform-origin: center;
  transform: rotate(-90deg);
}

.depth-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 20px 40px;
  gap: 16px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.depth-content::-webkit-scrollbar { display: none; }

.info-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.info-card-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.1px;
  color: var(--text-faint);
  margin-bottom: 8px;
}
.info-card-value {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.5;
}
.info-card-value strong {
  color: var(--text);
  font-weight: 600;
}

.action-hint {
  background: var(--accent-dim);
  border: 1px solid rgba(79,152,163,0.2);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
}
.action-hint svg { flex-shrink: 0; opacity: 0.8; }

.depth-max-card {
  background: linear-gradient(135deg, rgba(79,152,163,0.12), rgba(79,152,163,0.04));
  border: 1px solid rgba(79,152,163,0.3);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
}
.depth-max-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 6px;
}
.depth-max-sub {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
}

.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  z-index: 1000;
  transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
  opacity: 0;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>
<body>

<div class="screen active" id="screen-home">
  <div class="header">
    <div class="header-top">
      <span class="app-title">Prompt History</span>
      <span class="header-badge">&#x221E; Long Press</span>
    </div>
    <div class="header-sub">20 prompts &middot; long press any to dive deeper</div>
  </div>
  <div class="scroll-area">
    <div class="prompt-list" id="prompt-list"></div>
  </div>
</div>

<div class="screen" id="screen-depth">
  <div class="depth-header">
    <button class="back-btn" id="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      <span id="back-label">Back</span>
    </button>
    <div class="depth-label" id="depth-label">DEPTH 1 &middot; PROMPT 1</div>
    <div class="depth-title" id="depth-title">Layer 1</div>
    <div class="depth-subtitle" id="depth-subtitle">Long press to go deeper &middot; Double-tap to go back</div>
    <div class="depth-dots" id="depth-dots"></div>
  </div>
  <div class="depth-content" id="depth-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PROMPTS = [
  "What do you think of the PWA with one-screen-at-a-time flows, a settings screen for saving a GitHub Personal Access Token in localStorage?",
  "Summarize the most recent file I uploaded and extract all action items",
  "Write a product brief for an infinite long press UI pattern for mobile apps",
  "How should I structure a monorepo for three related TypeScript packages?",
  "What's the best way to handle auth state in a PWA that works offline?",
  "Compare IndexedDB vs localStorage for storing prompt history in a mobile web app",
  "Design a haptic feedback system for gesture-based navigation on iOS Safari",
  "What would a good commit structure look like for the m-mcp protocol repo?",
  "Explain the post-OCR geometry engine pipeline from raw TSV to markdown output",
  "How do I make a GitHub Pages site testable on mobile without a build step?",
  "Write a README for a UI pattern library focused on mobile-native gestures",
  "What are the tradeoffs between sheet-based navigation and stack navigation on mobile?",
  "Generate 10 names for a gesture UI pattern called infinite long press",
  "How should depth indicators work in a layered mobile UI — dots, numbers, or breadcrumbs?",
  "What's the difference between touchstart and pointerdown for long press detection?",
  "Design the data model for storing prompt depth state across sessions",
  "Write acceptance criteria for the infinite long press gesture on a prompt card",
  "How do I prevent scroll interference when detecting long press on a scrollable list?",
  "What CSS animations make depth transitions feel physical and spatial?",
  "Suggest a color system for visualizing depth levels 1-10 in a dark UI"
];

const MAX_DEPTH = 10;
const LONG_PRESS_MS = 600;
let currentPromptIndex = 0;
let currentDepth = 0;
let isTransitioning = false;
let lastTapTime = 0;

const homeScreen = document.getElementById('screen-home');
const depthScreen = document.getElementById('screen-depth');

const depthData = [
  null,
  { icon: '📋', title: 'Prompt Overview', desc: 'The full prompt text and original context.' },
  { icon: '🔍', title: 'Prompt Analysis', desc: 'Intent, tone, and extracted keywords.' },
  { icon: '🧩', title: 'Linked Assets', desc: 'Files, URLs, and context referenced in this prompt.' },
  { icon: '📊', title: 'Token Usage', desc: 'Estimated tokens, model used, and cost.' },
  { icon: '🕓', title: 'Session History', desc: 'When this prompt ran and what preceded it.' },
  { icon: '🔁', title: 'Variations', desc: 'Similar prompts you have run before.' },
  { icon: '🧠', title: 'Model Memory', desc: 'What the model knew about you at this moment.' },
  { icon: '⚙️', title: 'Raw Config', desc: 'System prompt, temperature, and inference params.' },
  { icon: '📤', title: 'Export Options', desc: 'Copy, share, save as .osmd, or push to repo.' },
  { icon: '🗂️', title: 'Archive', desc: 'Version history and diff from prior runs.' },
];

function showHome() {
  if (isTransitioning) return;
  isTransitioning = true;
  depthScreen.classList.add('exit-back');
  depthScreen.classList.remove('active');
  setTimeout(() => {
    depthScreen.classList.remove('exit-back');
    homeScreen.classList.add('active');
    isTransitioning = false;
    currentDepth = 0;
  }, 240);
}

function showDepth(promptIndex, depth) {
  if (isTransitioning) return;
  isTransitioning = true;
  currentPromptIndex = promptIndex;
  currentDepth = depth;
  renderDepthScreen(promptIndex, depth);
  homeScreen.classList.remove('active');
  depthScreen.classList.remove('active', 'exit-back');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      depthScreen.classList.add('active');
      isTransitioning = false;
    });
  });
}

function goDeeper() {
  if (currentDepth >= MAX_DEPTH || isTransitioning) return;
  vibrate([12]);
  showDepth(currentPromptIndex, currentDepth + 1);
}

function goBack() {
  if (isTransitioning) return;
  vibrate([8, 40, 8]);
  if (currentDepth <= 1) { showHome(); }
  else { showDepth(currentPromptIndex, currentDepth - 1); }
}

function renderDepthScreen(promptIndex, depth) {
  const data = depthData[depth] || depthData[1];
  document.getElementById('back-label').textContent = depth === 1 ? 'Prompt History' : 'Depth ' + (depth - 1);
  document.getElementById('depth-label').textContent = 'DEPTH ' + depth + ' \u00B7 PROMPT ' + (promptIndex + 1);
  document.getElementById('depth-title').textContent = data.icon + ' ' + data.title;
  document.getElementById('depth-subtitle').textContent = depth < MAX_DEPTH
    ? 'Long press to go deeper \u00B7 Double-tap to go back'
    : 'Maximum depth reached \u00B7 Double-tap to surface';

  const dotsEl = document.getElementById('depth-dots');
  dotsEl.innerHTML = '';
  for (let i = 1; i <= MAX_DEPTH; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === depth ? ' active' : i < depth ? ' filled' : '');
    dotsEl.appendChild(dot);
  }

  const content = document.getElementById('depth-content');
  content.innerHTML = '';

  const infoCard = document.createElement('div');
  infoCard.className = 'info-card';
  infoCard.innerHTML = '<div class="info-card-label">What\'s here</div><div class="info-card-value">' + data.desc + '<br><br>Prompt <strong>#' + (promptIndex + 1) + '</strong> &middot; Depth <strong>' + depth + ' of ' + MAX_DEPTH + '</strong></div>';
  content.appendChild(infoCard);

  const previewCard = document.createElement('div');
  previewCard.className = 'info-card';
  const previewText = PROMPTS[promptIndex].substring(0, 120) + (PROMPTS[promptIndex].length > 120 ? '\u2026' : '');
  previewCard.innerHTML = '<div class="info-card-label">Prompt</div><div class="info-card-value">&ldquo;' + previewText + '&rdquo;</div>';
  content.appendChild(previewCard);

  if (depth < MAX_DEPTH) {
    const hint = document.createElement('div');
    hint.className = 'action-hint';
    hint.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> Hold anywhere below to dive to depth ' + (depth + 1);
    content.appendChild(hint);
    setupDepthPress(content);
  } else {
    const maxCard = document.createElement('div');
    maxCard.className = 'depth-max-card';
    maxCard.innerHTML = '<div class="depth-max-title">Maximum Depth Reached</div><div class="depth-max-sub">You\'ve reached depth 10 of 10.<br>Double-tap anywhere to surface back up.</div>';
    content.appendChild(maxCard);
  }
}

function buildPromptList() {
  const list = document.getElementById('prompt-list');
  const times = ['2h','3h','5h','1d','2d','3d','4d'];
  PROMPTS.forEach((text, i) => {
    const item = document.createElement('div');
    item.className = 'prompt-item';
    const t = times[i % times.length];
    item.innerHTML = '<div class="prompt-text">' + text + '</div><div class="prompt-meta"><span class="prompt-time">' + t + ' ago</span><span class="prompt-depth-badge">10 layers</span></div><svg class="press-ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22"/></svg>';
    setupLongPress(item, () => { showDepth(i, 1); });
    list.appendChild(item);
  });
}

function setupLongPress(el, onFire) {
  const ring = el.querySelector('.press-ring circle');
  let timer = null;
  let startX = 0, startY = 0, moved = false;
  function start(e) {
    if (e.touches && e.touches.length > 1) return;
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; moved = false;
    el.classList.add('pressing');
    if (ring) { ring.style.transition = 'stroke-dashoffset ' + LONG_PRESS_MS + 'ms linear'; ring.style.strokeDashoffset = '0'; }
    timer = setTimeout(() => { if (!moved) { vibrate([15,30,15]); onFire(); } cancel(); }, LONG_PRESS_MS);
  }
  function move(e) {
    const t = e.touches ? e.touches[0] : e;
    if (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) { moved = true; cancel(); }
  }
  function cancel() {
    el.classList.remove('pressing');
    if (ring) { ring.style.transition = 'stroke-dashoffset 0.2s ease'; ring.style.strokeDashoffset = '138'; }
    clearTimeout(timer);
  }
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove', move, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

function setupDepthPress(el) {
  let timer = null;
  let startX = 0, startY = 0, moved = false;
  function start(e) {
    if (e.target.closest('.back-btn')) return;
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; moved = false;
    el.style.transition = 'background 0.6s linear';
    el.style.background = 'rgba(79,152,163,0.04)';
    timer = setTimeout(() => { if (!moved) { el.style.background = ''; goDeeper(); } cancel(); }, LONG_PRESS_MS);
  }
  function move(e) {
    const t = e.touches ? e.touches[0] : e;
    if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) { moved = true; cancel(); }
  }
  function cancel() { clearTimeout(timer); el.style.background = ''; }
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove', move, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', cancel);
}

depthScreen.addEventListener('touchend', (e) => {
  if (e.target.closest('.back-btn')) return;
  const now = Date.now();
  if (now - lastTapTime < 320) { goBack(); lastTapTime = 0; }
  else { lastTapTime = now; }
});
depthScreen.addEventListener('dblclick', (e) => {
  if (e.target.closest('.back-btn')) return;
  goBack();
});

document.getElementById('back-btn').addEventListener('click', goBack);

function vibrate(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }

buildPromptList();
</script>
</body>
</html>
